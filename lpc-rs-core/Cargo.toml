[package]
name = "lpc-rs-core"
description = "lpc-rs LPC compiler and gamedriver suite core utilities."
version = "0.1.0"
authors = ["mpd <mpd@jesters-court.net>"]
edition = "2021"
readme = "README.md"
repository = "https://github.com/xxx/lpc-rs"
license = "MIT"
keywords = ["lpc", "mud", "driver", "compiler"]
categories = ["command-line-utilities", "compilers", "game-engines"]

[dependencies]
bstr = "1.3.0"
decorum = "0.4.0"
derive_builder = "0.20.2"
indextree = { version = "4.3.1", features = ["deser"] }
modular-bitfield = "0.13.1"
once_cell = "1.17.1"
path-absolutize = { version = "4.0.1", features = ["fixed_workdir"] }
serde = { version = "1.0.123", features = ["derive"] }
ustr = { version = "1.1.0", features = ["serde"] }