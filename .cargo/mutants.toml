# Expand this allowlist one module at a time after reviewing its survivors and runtime.
examine_globs = [
    "lpc-rs-core/src/register_counter.rs",
    "lpc-rs-core/src/function_flags.rs",
    "lpc-rs-core/src/lpc_type_union.rs",
    "lpc-rs-core/src/visibility.rs",
    "lpc-rs-core/src/global_var_flags.rs",
    "lpc-rs-core/src/register.rs",
    "lpc-rs-core/src/lpc_type.rs",
    "lpc-rs-core/src/lpc_path.rs",
    "lpc-rs-core/src/lpc_path/root.rs",
    "lpc-rs-core/src/class.rs",
    "lpc-rs-core/src/call_namespace.rs",
    "lpc-rs-core/src/function_receiver.rs",
]
additional_cargo_args = ["--locked"]
minimum_test_timeout = 20
gitignore = true
copy_target = false

# At equality both branches assign base_count, so < and <= are equivalent.
exclude_re = ['^lpc-rs-core/src/register_counter\.rs:\d+:\d+: replace < with <= in RegisterCounter::set$']
