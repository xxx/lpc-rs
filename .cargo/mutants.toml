# Expand this allowlist one module at a time after reviewing its survivors and runtime.
examine_globs = [
    "lpc-rs-core/src/register_counter.rs",
    "lpc-rs-core/src/function_flags.rs",
    "lpc-rs-core/src/lpc_type_union.rs",
    "lpc-rs-core/src/visibility.rs",
    "lpc-rs-core/src/global_var_flags.rs",
    "lpc-rs-core/src/register.rs",
    "lpc-rs-core/src/lpc_type.rs",
    "lpc-rs-core/src/lpc_path.rs",
    "lpc-rs-core/src/lpc_path/root.rs",
    "lpc-rs-core/src/class.rs",
    "lpc-rs-core/src/call_namespace.rs",
    "lpc-rs-core/src/function_receiver.rs",
    "lpc-rs-core/src/null_mode.rs",
    "lpc-rs-core/src/lib.rs",
    "lpc-rs-function-support/src/function_prototype.rs",
    "lpc-rs-function-support/src/constant.rs",
    "lpc-rs-function-support/src/symbol.rs",
    "lpc-rs-function-support/src/program_function.rs",
    "lpc-rs-utils/src/lpc_bytes.rs",
    "lpc-rs-utils/src/string.rs",
    "lpc-rs-utils/src/lpc_string.rs",
    "lpc-rs-utils/src/lib.rs",
    "lpc-rs-utils/src/debug_log.rs",
    "lpc-rs-utils/src/config.rs",
    "lpc-rs-utils/src/tls.rs",
    "lpc-rs-asm/src/address.rs",
    "lpc-rs-asm/src/instruction.rs",
    "lpc-rs-errors/src/span.rs",
    "lpc-rs-errors/src/error_frames.rs",
    "lpc-rs-errors/src/source_map.rs",
    "lpc-rs-errors/src/source_map/source_file.rs",
    "lpc-rs-errors/src/lib.rs",
    "src/interpreter/efun/abs.rs",
    "src/interpreter/lpc_int.rs",
    "src/interpreter/lpc_float.rs",
    "src/interpreter/lpc_mapping.rs",
    "src/interpreter/lpc_array.rs",
    "lpc-rs-telnet/src/opt.rs",
    "lpc-rs-telnet/src/parser.rs",
]
additional_cargo_args = ["--locked"]
test_tool = "nextest"
minimum_test_timeout = 20
gitignore = true
copy_target = false

exclude_re = [
    # At equality both branches assign base_count, so < and <= are equivalent.
    '^lpc-rs-core/src/register_counter\.rs:\d+:\d+: replace < with <= in RegisterCounter::set$',
    # file_id() clears the warning bit, so OR and XOR set the same disjoint bit.
    '^lpc-rs-errors/src/span\.rs:\d+:\d+: replace \| with \^ in Span::with_warnings_suppressed$',
]
