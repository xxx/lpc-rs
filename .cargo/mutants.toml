test_tool = "nextest"
minimum_test_timeout = 20
gitignore = true
copy_target = false

exclude_re = [
    # At equality the argument-padding range is empty.
    "^src/interpreter/efun/efun_context\\.rs:187:23: replace < with <= in EfunContext<'task, N>::build$",
    # The scalar integer store and fallback replacement produce the same LPC value.
    "^src/interpreter/efun/efun_context\\.rs:341:17: delete match arm LpcRef::Int\\(x\\) in EfunContext<'task, N>::return_efun_result$",
    # Regex option bits are disjoint, so XOR constructs the same supported mask.
    '^src/interpreter/efun/regmatch\.rs:(16|17|18|19|20|21):5: replace \| with \^$',
    # At equality both branches assign base_count, so < and <= are equivalent.
    '^lpc-rs-core/src/register_counter\.rs:\d+:\d+: replace < with <= in RegisterCounter::set$',
    # file_id() clears the warning bit, so OR and XOR set the same disjoint bit.
    '^lpc-rs-errors/src/span\.rs:\d+:\d+: replace \| with \^ in Span::with_warnings_suppressed$',
    # Linear reservation hints change neither framed bytes nor memory growth order.
    # Revisit these exclusions if these functions gain arithmetic outside reserve().
    '^lpc-rs-telnet/src/wire\.rs:\d+:\d+: replace \+ with \* in subnegotiation$',
    '^lpc-rs-telnet/src/wire\.rs:\d+:\d+: replace \+ with - in text$',
    '^lpc-rs-telnet/src/wire\.rs:\d+:\d+: replace / with (\*|%) in text$',
    # The inner function's register can hold the result after that call returns.
    # Revisit this pinned expression if instruction lifetimes change.
    '^src/interpreter/efun/compose\.rs:33:32: replace \+ with \* in compose_executor$',
]
