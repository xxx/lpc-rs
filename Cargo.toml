[package]
name = "lpc-rs"
version = "0.1.0"
authors = ["mpd <mpd@jesters-court.net>"]
edition = "2024"
description = "lpc-rs LPC compiler and gamedriver suite."
readme = "README.md"
repository = "https://github.com/xxx/lpc-rs"
license = "MIT"
keywords = ["lpc", "mud", "driver", "compiler"]
categories = ["command-line-utilities", "compilers", "game-engines"]

[build-dependencies]
lalrpop = "0.23.1"

[dependencies]
lpc-rs-asm = { version = "0.1", path = "./lpc-rs-asm"}
lpc-rs-core = { version = "0.1", path = "./lpc-rs-core"}
lpc-rs-errors = { version = "0.1", path = "./lpc-rs-errors"}
lpc-rs-function-support = { version = "0.1", path = "./lpc-rs-function-support"}
lpc-rs-telnet = { version = "0.1", path = "./lpc-rs-telnet"}
lpc-rs-utils = { version = "0.1", path = "./lpc-rs-utils"}

arc-swap = { version = "1.9.2", features = ["weak"] }
async-trait = "0.1.92"
bit-set = "0.11.1"
bytes = "1.12.1"
ahash = "0.8.12"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dashmap = "6.2.1"
decorum = "0.4.0"
delegate = "0.13.5"
derive_builder = "0.20.2"
dns-lookup = "4.0.1"
educe = "0.8.1"
flume = "0.12.0"
imbl = "7.0.2"
fastrand = "2.5.0"
hex = "0.4.3"
indexmap = "2.14.2"
indextree = { version = "4.9.1", features = ["deser"] }
itertools = "0.15.0"
lalrpop-util = "0.23.1"
logos = "0.16.1"
lru = "0.18.4"
md-5 = "0.11.0"
parking_lot = "0.12.5"
spin = "0.12.3"
path-dedot = "4.0.1"
phf = { version = "0.14.0", features = ["macros"] }
pwhash = "1.0.0"
readonly = "0.2.14"
regex = "1.13.1"
regex-automata = "0.4.18"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
stable-vec = "0.4.3"
smallvec = "1.16.1"
thin-vec = "0.2.19"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "sync", "fs", "rt-multi-thread", "signal", "parking_lot", "net", "time", "macros"] }
tracing = "~0.1.44"
ustr = "1.1.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
claims = "0.8.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
factori-imp = "0.9.3"
fake = "5.1.0"
indoc = "2.0.7"
pprof = { version = "0.15.0", default-features = false, features = ["flamegraph"] }
rpds = "1.2.1"
# Adds test-util (the paused clock) to test builds; production builds carry no dev-deps.
tokio = { version = "1.53.1", features = ["test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5.4"
jemalloc-ctl = "0.5.4"

[features]
default = ["max_level_trace", "release_max_level_debug"]

# Per-opcode dispatch counters in the eval loop.
opcode-profile = []

# Max log level (development build)
max_level_off = ["tracing/max_level_off"]
max_level_error = ["tracing/max_level_error"]
max_level_warn = ["tracing/max_level_warn"]
max_level_info = ["tracing/max_level_info"]
max_level_debug = ["tracing/max_level_debug"]
max_level_trace = ["tracing/max_level_trace"]

# Max log level (release build)
release_max_level_off = ["tracing/release_max_level_off"]
release_max_level_error = ["tracing/release_max_level_error"]
release_max_level_warn = ["tracing/release_max_level_warn"]
release_max_level_info = ["tracing/release_max_level_info"]
release_max_level_debug = ["tracing/release_max_level_debug"]
release_max_level_trace = ["tracing/release_max_level_trace"]

[[bench]]
name = "bench_fib"
harness = false

[[bench]]
name = "bench_cells"
harness = false

[[bench]]
name = "bench_concurrency"
harness = false

[[bench]]
name = "bench_payload"
harness = false

[[bench]]
name = "bench_grammar"
harness = false

[workspace]
members = [
    "lpc-rs-asm",
    "lpc-rs-core",
    "lpc-rs-driver",
    "lpc-rs-errors",
    "lpc-rs-function-support",
    "lpc-rs-lpcc",
    "lpc-rs-telnet",
    "lpc-rs-utils",
]
exclude = ["lpc-rs-telnet/fuzz"]

[profile.release]
lto = "thin"

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.bench]
debug = 1
